<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon Says game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div><h1>Simon Says</h1></div>
  <div><h2 class="h2">Press any key to start the game</h2></div>
  <div class="btn-div">
    <div class="red-btn"><button id="red"></button></div>
    <div class="blue-btn"><button id="blue"></button></div>
    <div class="green-btn"><button id="green"></button></div>
    <div class="orange-btn"><button id="orange"></button></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
